<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%231a1d24'/><text x='14' y='68' font-family='monospace' font-size='52' font-weight='bold' fill='%234a90d9'>&gt;_</text></svg>">
  <title>{{TITLE}}</title>
  <style>
    * { box-sizing: border-box; }
    html, body { overflow: hidden; overscroll-behavior: none; }
    body { margin: 0; padding: 0; height: 100vh; background: #0f131a; display: flex; flex-direction: column; }
    #terminal-shell { flex: 1; width: 100%; overscroll-behavior: none; touch-action: none; }
    #terminal { width: 100%; height: 100%; border: none; display: block; }
    {{VKBD_STYLE}}
  </style>
</head>
<body>
  <div id="terminal-shell">
    <iframe id="terminal" src="{{TTYD_URL}}" allow="clipboard-write; clipboard-read"></iframe>
  </div>
  {{TAB_HANDLER_SCRIPT}}
  {{VKBD_HTML}}
</body>
</html>
