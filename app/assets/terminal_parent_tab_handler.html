<script>
  (function() {
    var iframe = document.getElementById('terminal');

    function focusTerminal() {
      try {
        if (!iframe || !iframe.contentWindow) return;
        iframe.contentWindow.focus();
        var doc = iframe.contentWindow.document;
        if (!doc) return;
        var textarea = doc.querySelector('.xterm-helper-textarea');
        if (textarea) textarea.focus();
      } catch (e) {}
    }

    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Tab') return;

      if (document.activeElement === iframe ||
          (iframe && iframe.contains && iframe.contains(document.activeElement))) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    if (iframe) {
      iframe.addEventListener('focus', function() {
        focusTerminal();
      });
    }

    // Paste/drop can land on the parent page when the iframe is not focused
    // (e.g. right after load, and routinely on mobile where focus is not in
    // the iframe). The parent forwards ONLY image payloads into the iframe's
    // uploader; plain text is deliberately left untouched so it reaches
    // xterm's native paste/drop handling. Forwarding text here (the #53/#54
    // behavior) suppressed the native path with preventDefault while the iOS
    // paste gesture exposes an empty getData('text/plain') — so the text was
    // lost on mobile (regression #66).
    function forwardImageTransfer(dataTransfer) {
      try {
        var win = iframe && iframe.contentWindow;
        if (win && win.__handleImageTransfer) return win.__handleImageTransfer(dataTransfer);
      } catch (e) {}
      // Only worth a warning when files were actually present: text-only
      // pastes routinely land here and are intentionally not forwarded.
      if (dataTransfer && dataTransfer.files && dataTransfer.files.length) {
        console.warn('terminal iframe not ready for image upload');
      }
      return false;
    }

    document.addEventListener('paste', function(e) {
      // Only consume (and suppress the native path) when an image was handled;
      // text paste falls through to xterm untouched.
      if (forwardImageTransfer(e.clipboardData)) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    document.addEventListener('dragover', function(e) {
      e.preventDefault();
    }, true);

    document.addEventListener('drop', function(e) {
      // Suppress the default only when an image was actually uploaded, or when
      // some other file was dropped (a bare file drop would navigate the page
      // away). Text drops fall through to xterm.
      var source = e.dataTransfer;
      if (forwardImageTransfer(source) || containsFiles(source)) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    // Mirror the iframe's file-detection so a non-image file drop is blocked
    // from navigating the page, without duplicating the triage.
    function containsFiles(source) {
      if (!source) return false;
      if (source.files && source.files.length) return true;
      var items = source.items;
      if (items) {
        for (var i = 0; i < items.length; i++) {
          if (items[i].kind === 'file') return true;
        }
      }
      return false;
    }
  })();
</script>
