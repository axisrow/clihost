<button id="vkbd-toggle" type="button" aria-label="Toggle virtual keyboard" aria-pressed="false" title="Toggle keyboard">&#9000;</button>
<div class="vkbd" id="vkbd">
  <div class="vkbd-row">
    <button data-key="esc" class="key-action">ESC</button>
    <button data-key="1">1</button>
    <button data-key="2">2</button>
    <button data-key="3">3</button>
    <button data-key="4">4</button>
    <button data-key="5">5</button>
    <button data-key="backspace" class="key-action">&#9003;</button>
  </div>
  <div class="vkbd-bottom">
    <button data-key="tab" style="grid-area:tab">Tab</button>
    <button data-key="shift-tab" style="grid-area:stab">&#8617;Tab</button>
    <button data-key="slash" style="grid-area:slash">/</button>
    <button data-key="bang" style="grid-area:bang">!</button>
    <button data-key="ctrl-l" style="grid-area:cl" class="key-mod">^L</button>
    <button data-key="up" style="grid-area:up">&#8593;</button>
    <button data-key="scroll" style="grid-area:ut" class="key-scroll" title="Toggle scroll (tmux mouse mode)">&#8645;</button>
    <button data-key="enter" style="grid-area:enter" class="key-enter">&#8629;</button>
    <button data-key="ctrl-c" style="grid-area:cc" class="key-mod">^C</button>
    <button data-key="ctrl-v" style="grid-area:cv" class="key-mod">^V</button>
    <button data-key="at" style="grid-area:at">@</button>
    <button data-key="ctrl-b" style="grid-area:cb" class="key-mod">^B</button>
    <button data-key="left" style="grid-area:left">&#8592;</button>
    <button data-key="down" style="grid-area:down">&#8595;</button>
    <button data-key="right" style="grid-area:right">&#8594;</button>
  </div>
</div>
<script>
  (function() {
    var iframe = document.getElementById('terminal');

    function focusTerminal() {
      try {
        if (iframe.contentWindow) iframe.contentWindow.focus();
        var doc = iframe.contentWindow && iframe.contentWindow.document;
        if (doc) {
          var textarea = doc.querySelector('.xterm-helper-textarea');
          if (textarea) textarea.focus();
        }
      } catch (e) {}
    }

    // Deliver pasted text through xterm's term.paste (honours bracketed-paste
    // mode, so multi-line text is safe) and fall back to a raw ttyd frame only
    // when term.paste is unavailable. Returns false if nothing could send it.
    function pasteIntoTerminal(text) {
      try {
        var win = iframe.contentWindow;
        if (win && win.term && win.term.paste) {
          win.term.paste(text);
          return true;
        }
        // Fall back to the iframe's shared sender (owns socket discovery + the
        // '0' ttyd INPUT prefix) instead of an inline copy (#101/#14).
        if (win && win.__sendToTTYD) {
          return win.__sendToTTYD(text);
        }
      } catch (e) {}
      return false;
    }

    function sendKey(key) {
      focusTerminal();

      if (key === 'tab' || key === 'shift-tab') {
        try {
          var win = iframe.contentWindow;
          if (win && win.sendTabKey) {
            win.sendTabKey(key === 'shift-tab');
            return;
          }
        } catch (e) {}
      }

      if (key === 'ctrl-v') {
        if (!navigator.clipboard || !navigator.clipboard.readText) {
          console.warn('^V: clipboard API unavailable (needs a secure context)');
          return;
        }
        navigator.clipboard.readText().then(function(text) {
          if (!text) return;
          if (!pasteIntoTerminal(text)) {
            console.warn('^V: clipboard read but terminal not ready');
          }
        }).catch(function(err) {
          // Mobile browsers reject readText() when focus left the iframe or the
          // permission was denied — surface it instead of swallowing silently.
          console.warn('^V: clipboard read failed:', err);
        });
        return;
      }

      try {
        var win = iframe.contentWindow;
        var data = null;
        var ESC = String.fromCharCode(27);
        switch (key) {
          case 'esc': data = ESC; break;
          case 'ctrl-c': data = String.fromCharCode(3); break;
          case 'ctrl-b': data = String.fromCharCode(2); break;
          case 'ctrl-l': data = String.fromCharCode(12); break;
          case 'up': data = ESC + '[A'; break;
          case 'down': data = ESC + '[B'; break;
          case 'right': data = ESC + '[C'; break;
          case 'left': data = ESC + '[D'; break;
          case '1': case '2': case '3': case '4': case '5':
            data = key; break;
          case 'slash': data = '/'; break;
          case 'bang': data = '!'; break;
          case 'backspace': data = String.fromCharCode(127); break;
          case 'enter': data = '\r'; break;
          // tmux prefix (Ctrl+B) + m — toggles tmux mouse mode (scroll on/off)
          case 'scroll': data = String.fromCharCode(2) + 'm'; break;
          case 'at': data = '@'; break;
        }
        // Send via the iframe's shared sender (owns socket discovery + the '0'
        // ttyd INPUT prefix) instead of an inline socket copy (#101/#14).
        if (data && win && win.__sendToTTYD) {
          win.__sendToTTYD(data);
        }
      } catch (e) {}
    }

    document.getElementById('vkbd').addEventListener('click', function(e) {
      if (e.target.tagName === 'BUTTON') {
        sendKey(e.target.dataset.key);
        if (e.target.dataset.key === 'scroll') e.target.classList.toggle('on');
      }
    });

    // --- Keyboard toggle (issue #32) ---
    var STORAGE_KEY = 'clihost:vkbd-open';
    var toggleBtn = document.getElementById('vkbd-toggle');

    function notifyTerminalResize() {
      // The browser fires resize in the iframe when its box changes, but the
      // re-fit can read stale dimensions (iOS layout timing) — nudge it again.
      try {
        var win = iframe.contentWindow;
        if (win) win.dispatchEvent(new Event('resize'));
      } catch (e) {}
    }

    function applyVkbdState(open) {
      document.body.classList.toggle('vkbd-open', open);
      toggleBtn.setAttribute('aria-pressed', open ? 'true' : 'false');
    }

    toggleBtn.addEventListener('click', function() {
      var open = !document.body.classList.contains('vkbd-open');
      applyVkbdState(open);
      try { localStorage.setItem(STORAGE_KEY, open ? '1' : '0'); } catch (e) {}
      // Flex resizes #terminal-shell synchronously; let layout settle, then
      // re-fit the terminal (two frames for reliability on iOS).
      requestAnimationFrame(function() {
        notifyTerminalResize();
        requestAnimationFrame(notifyTerminalResize);
      });
      focusTerminal();
    });

    // No stored choice yet: open on narrow (mobile) screens, closed on desktop.
    var stored = null;
    try { stored = localStorage.getItem(STORAGE_KEY); } catch (e) {}
    applyVkbdState(stored === null
      ? window.matchMedia('(max-width: 768px)').matches
      : stored === '1');

    iframe.addEventListener('load', function() {
      focusTerminal();
      // The terminal may have fitted before the class was applied — re-fit it.
      notifyTerminalResize();
    });
  })();
</script>
