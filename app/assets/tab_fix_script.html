<script>
(function() {
  window._ttydSocket = null;
  var OrigWebSocket = window.WebSocket;
  window.WebSocket = function(url, protocols) {
    var ws = protocols ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
    if (url && url.indexOf('/ws') !== -1) {
      window._ttydSocket = ws;
    }
    return ws;
  };
  window.WebSocket.prototype = OrigWebSocket.prototype;
  window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
  window.WebSocket.OPEN = OrigWebSocket.OPEN;
  window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
  window.WebSocket.CLOSED = OrigWebSocket.CLOSED;

  function getSocket() {
    return window._ttydSocket || window.socket || window.ws;
  }

  function waitForTerm(cb) {
    if (window.term) { cb(window.term); return; }
    var attempts = 0;
    var i = setInterval(function() {
      if (window.term) { clearInterval(i); cb(window.term); }
      else if (++attempts > 600) { clearInterval(i); console.warn('ttyd term not found after 30s, giving up'); }
    }, 50);
  }

  function sendToTTYD(data) {
    var socket = getSocket();
    if (socket && socket.readyState === 1) {
      socket.send('0' + data);
      return true;
    }
    return false;
  }

  function isAlternateScreen(term) {
    var isAlt = false;
    try {
      if (term.buffer && term.buffer.active) {
        isAlt = term.buffer.active.type === 'alternate';
      }
      if (!isAlt && term._core && term._core.buffer) {
        isAlt = term._core.buffer.active === term._core.buffer.alternate;
      }
    } catch(err) {}
    return isAlt;
  }

  function getCsrfToken() {
    var match = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]*)/);
    return match ? match[1] : '';
  }

  function extractImageFiles(source) {
    var files = [];
    var i;
    if (source && source.items) {
      for (i = 0; i < source.items.length; i++) {
        var item = source.items[i];
        if (item.kind === 'file' && item.type.indexOf('image/') === 0) {
          var file = item.getAsFile();
          if (file) files.push(file);
        }
      }
    }
    // Safari screenshot pastes can populate .files while .items stays empty.
    if (!files.length && source && source.files) {
      for (i = 0; i < source.files.length; i++) {
        if (source.files[i].type.indexOf('image/') === 0) files.push(source.files[i]);
      }
    }
    return files;
  }

  var MAX_UPLOAD_FILES = 5;

  function uploadImageFile(file, csrfToken) {
    return fetch('/upload', {
      method: 'POST',
      headers: { 'X-CSRF-Token': csrfToken },
      body: file
    }).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(data) {
      return data.path;
    }).catch(function(err) {
      console.warn('image upload failed:', err);
      return null;
    });
  }

  function uploadImageFiles(files) {
    // Uploads run in parallel; the paths are typed afterwards in the
    // original order, skipping files whose upload failed.
    var csrfToken = getCsrfToken();
    var uploads = files.slice(0, MAX_UPLOAD_FILES).map(function(file) {
      return uploadImageFile(file, csrfToken);
    });
    return Promise.all(uploads).then(function(paths) {
      paths.forEach(function(path) {
        if (path === null) return;
        if (!sendToTTYD(path + ' ')) {
          console.warn('image uploaded but terminal socket not ready:', path);
        }
      });
    }).catch(function(err) {
      console.warn('upload pipeline error:', err);
    });
  }

  function containsFiles(source) {
    // Same items/files coverage as extractImageFiles, but deliberately WITHOUT
    // a MIME filter: any file (e.g. a dropped PDF) must block the text branch
    // so a non-image transfer is silently skipped, not typed as its file:// URL.
    if (!source) return false;
    if (source.files && source.files.length) return true;
    var items = source.items;
    if (items) {
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file') return true;
      }
    }
    return false;
  }

  function handleImageTransfer(source) {
    var images = extractImageFiles(source);
    if (!images.length) return false;
    uploadImageFiles(images);
    return true;
  }

  // The parent page (terminal_parent_tab_handler.html) delegates its paste/drop
  // events through this global instead of duplicating the upload logic. It
  // forwards ONLY images: text is deliberately left to xterm's native paste/drop
  // path so it keeps working on mobile, where the parent receives the event and
  // the iOS gesture exposes an empty getData('text/plain') (regression #66).
  window.__handleImageTransfer = handleImageTransfer;
  // Shared helpers exported so the parent page and the virtual keyboard delegate
  // here instead of keeping their own copies (#101/#14): containsFiles had two
  // byte-identical definitions and the socket-discovery + '0' ttyd-protocol
  // prefix were hard-coded in three places, so a protocol/quirk change silently
  // diverged. sendToTTYD owns the '0' INPUT prefix — the single place to change.
  window.__containsFiles = containsFiles;
  window.__sendToTTYD = sendToTTYD;

  document.addEventListener('paste', function(e) {
    // Only images are consumed on the iframe paste path: pasted text stays
    // on xterm's own default handling (bracketed paste, IME, etc.).
    if (handleImageTransfer(e.clipboardData)) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  document.addEventListener('dragover', function(e) {
    e.preventDefault();
  }, true);

  document.addEventListener('drop', function(e) {
    // Images upload; any other FILE is blocked (a dropped file would
    // otherwise navigate the iframe away from the terminal). Plain TEXT is
    // left to xterm's own drop handling — preventing the default here would
    // swallow it with nothing to replace it (regression #66).
    var source = e.dataTransfer;
    if (handleImageTransfer(source) || containsFiles(source)) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  waitForTerm(function(term) {
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        e.stopPropagation();

        var data = e.shiftKey ? '\x1b[Z' : '\t';

        if (sendToTTYD(data)) return;

        if (term._core && term._core.coreService) {
          term._core.coreService.triggerDataEvent(data);
          return;
        }

        if (term.input) {
          term.input(data);
        }
      }
    }, true);

    document.addEventListener('wheel', function(e) {
      if (isAlternateScreen(term)) return;
      e.preventDefault();
      e.stopPropagation();

      var lines;
      if (e.deltaMode === 1) {
        lines = e.deltaY;
      } else if (e.deltaMode === 2) {
        lines = e.deltaY > 0 ? term.rows : -term.rows;
      } else {
        lines = Math.round(e.deltaY / 40);
      }
      if (lines === 0) lines = e.deltaY > 0 ? 1 : -1;

      term.scrollLines(lines);
    }, { passive: false, capture: true });

    window.sendTabKey = function(shift) {
      var data = shift ? '\x1b[Z' : '\t';
      if (sendToTTYD(data)) return true;
      if (term._core && term._core.coreService) {
        term._core.coreService.triggerDataEvent(data);
        return true;
      }
      if (term.input) {
        term.input(data);
        return true;
      }
      return false;
    };

    window.isTerminalAlternateScreen = function() {
      return isAlternateScreen(term);
    };

    window.scrollTerminalLines = function(lines) {
      if (!term.scrollLines) return false;
      term.scrollLines(lines);
      return true;
    };

    var touchActive = false;
    var touchLastY = 0;
    var touchRemainder = 0;
    var TOUCH_LINE_HEIGHT = 24;

    function resetTouch() {
      touchActive = false;
      touchLastY = 0;
      touchRemainder = 0;
    }

    document.addEventListener('touchstart', function(e) {
      if (e.touches.length !== 1) { resetTouch(); return; }
      touchActive = true;
      touchLastY = e.touches[0].clientY;
      touchRemainder = 0;
    }, { capture: true, passive: true });

    document.addEventListener('touchmove', function(e) {
      if (!touchActive) return;
      if (e.touches.length !== 1) { resetTouch(); return; }
      if (isAlternateScreen(term)) return;

      var deltaY = e.touches[0].clientY - touchLastY;
      if (deltaY === 0) return;
      touchLastY = e.touches[0].clientY;
      touchRemainder += deltaY;

      e.preventDefault();
      e.stopPropagation();

      var steps = Math.trunc(touchRemainder / TOUCH_LINE_HEIGHT);
      if (steps === 0) return;
      touchRemainder -= steps * TOUCH_LINE_HEIGHT;
      term.scrollLines(-steps);
    }, { passive: false, capture: true });

    document.addEventListener('touchend', function() {
      if (touchActive) {
        var ta = document.querySelector('.xterm-helper-textarea');
        if (ta) ta.focus();
      }
      resetTouch();
    }, { capture: true, passive: true });
    document.addEventListener('touchcancel', resetTouch, { capture: true, passive: true });
  });
})();
</script>
